<script>
    (() => {
        //console.log("Initializing Notifications...");

        let notificationOffset = 0;
        const pageLength = 10;
        let totalUnread = 0;

        /*Load Notifications*/
        function loadNotifications(reset = false) {
            if (reset) {
                notificationOffset = 0;
                totalUnread = 0;
                const list = document.getElementById("notification-list");
                if (list) list.innerHTML = "";
            }

            frappe.call({
                method: "renewal_module.api.get_user_notifications",
                args: { offset: notificationOffset, limit: pageLength },
                callback: (r) => {
                    if (!r.message || r.message.length === 0) {
                        console.warn("No notifications found");
                        const seeMoreBtn = document.getElementById("see-more-btn");
                        if (seeMoreBtn) seeMoreBtn.style.display = "none";
                        return;
                    }

                    const notifications = r.message;
                    const container = document.getElementById("notification-list");
                    if (!container) return console.error("Missing #notification-list container");

                    notifications.forEach((n) => {
                        const dotClass = n.read ? "border border-primary1" : "bg-primary1";

                        const notificationDiv = document.createElement("div");
                        const safeHtml = (typeof DOMPurify !== "undefined")
                            ? DOMPurify.sanitize(String(n.subject || ""))
                            : frappe.utils.escape_html(String(n.subject || ""));
                        notificationDiv.className = "dropdown-item1 notification-item py-2 text-wrap d-flex align-items-center gap-2";
                        notificationDiv.innerHTML = `
						<span class="rounded-circle1 ${dotClass}" style="width:10px; height:10px; flex-shrink:0;"></span>
						<span class="flex-shrink-0 position-relative">
							<span class="avatar1-md rounded-circle1 bg-light d-flex align-items-center justify-content-center">
								<i class="bi bi-bell fs-4 text-primary"></i>
							</span>
						</span>
						<span class="flex-grow-1 text-muted">
							<span class="fw-medium text-body">${safeHtml}</span><br>
							<span class="fs-xs">${frappe.datetime.prettyDate(n.creation)}</span>
						</span>
					`;

                        notificationDiv.addEventListener("click", () => markAsRead(n, notificationDiv));
                        container.appendChild(notificationDiv);
                    });

                    notificationOffset += notifications.length;
                    totalUnread += notifications.filter(n => !n.read).length;
                    updateBadge(totalUnread);

                    const seeMoreBtn = document.getElementById("see-more-btn");
                    if (seeMoreBtn)
                        seeMoreBtn.style.display = notifications.length < pageLength ? "none" : "block";

                    const totalEl = document.getElementById("total-notifications");
                    if (totalEl) totalEl.innerText = `${notificationOffset} Notifications`;
                }
            });
        }

        /** ------------------------------
         *  Mark Notification as Read
         * ------------------------------ */
        function markAsRead(notification, element) {
            if (notification.read) return;

            frappe.call({
                method: "renewal_module.api.mark_notification_as_read",
                args: { notification_name: notification.name },
                callback: (r) => {
                    if (!r.exc) {
                        const dot = element.querySelector("span.rounded-circle1");
                        if (dot) {
                            dot.classList.remove("bg-primary");
                            dot.classList.add("border", "border-primary");
                        }
                        notification.read = 1;
                        if (totalUnread > 0) totalUnread--;
                        updateBadge(totalUnread);
                    }
                }
            });
        }

        /** ------------------------------
         *  Update Badge Count
         * ------------------------------ */
        function updateBadge(count) {
            const badge = document.querySelector(".topbar-badge");
            if (!badge) return;
            if (count > 0) {
                badge.innerText = count;
                badge.classList.remove("d-none");
            } else {
                badge.classList.add("d-none");
            }
        }

        /** ------------------------------
         *  See More Button Click
         * ------------------------------ */
        document.addEventListener("click", (e) => {
            if (e.target && e.target.id === "see-more-btn") {
                loadNotifications(false);
            }
        });

        /** ------------------------------
         *  Initial Load
         * ------------------------------ */
        frappe.after_ajax(() => {
            loadNotifications(true);
        });
    })();

    /** --------------------------------
     *  Avatar Handling
     * -------------------------------- */
    (() => {
        const avatarEl = document.getElementById("topbar-user-avatar1");
        if (!avatarEl) {
            console.warn("Missing #topbar-user-avatar element");
            return;
        }

        frappe.db.get_value("User", frappe.session.user, ["user_image", "full_name"])
            .then(r => {
                if (!r || !r.message) return;
                const { user_image, full_name } = r.message;

                if (user_image) {
                    avatarEl.innerHTML = `
					<img src="${user_image}" width="32" height="32" class="rounded-circle1" alt="user-image">
				`;
                } else {
                    const firstLetter = (full_name || frappe.session.user || "?").charAt(0).toUpperCase();
                    avatarEl.textContent = firstLetter;
                }
            })
            .catch(err => console.error("Failed to load user avatar:", err));
    })();

    /** global search **/
    (() => {
        // console.log("🔍 Initializing Global Search...");

        const $input = $(".topbar-search1");
        if (!$input.length) {
            //console.warn("⚠️ Missing .topbar-search1 input");
            return;
        }

        let $dropdown1 = null;

        function clearSearchResults() {
            if ($dropdown1) {
                $dropdown1.remove();
                $dropdown1 = null;
                $(document).off("click.searchDropdown");
            }
        }

        function showSearchResults(results, searchText) {
            clearSearchResults();

            const $searchBar = $input.closest(".app-search1");
            $searchBar.css("position", "relative");

            $dropdown1 = $('<div class="search-results-dropdown"></div>').css({
                position: "absolute",
                top: "100%",
                left: 0,
                background: "#fff",
                border: "1px solid #ddd",
                width: "100%",
                zIndex: 9999,
                maxHeight: "300px",
                overflowY: "auto",
                display: "none",
            });

            $searchBar.append($dropdown1);

            const regex = new RegExp(`(${searchText})`, "ig");

            results.forEach(item => {
                const label = item.label || item.name || item.doctype || item.value;
                const highlightedLabel = label.replace(regex, "<mark>$1</mark>");
                const $item = $('<div class="search-item"></div>')
                    .css({ padding: "5px 10px", cursor: "pointer" })
                    .html(highlightedLabel);

                $item.hover(
                    () => $item.css("background", "#f8f9fa"),
                    () => $item.css("background", "white")
                );

                //$item.on("click", () => frappe.set_route("Form", item.doctype, item.value));
                $item.on("click", () => {
                    $input.val("");
                    clearSearchResults();
                    frappe.set_route("Form", item.doctype, item.value);
                });

                $dropdown1.append($item);
            });

            $dropdown1.show();

            $(document).on("click.searchDropdown", (e) => {
                if (!$(e.target).closest($searchBar).length) clearSearchResults();
            });
        }

        $input.on(
            "input",
            frappe.utils.debounce(function () {
                const txt = $(this).val().trim();
                //console.log("🔎 Search text:", txt);
                if (!txt) {
                    clearSearchResults();
                    return;
                }

                frappe.call({
                    method: "renewal_module.api.global_search",
                    args: { txt },
                    callback: (r) => {
                        if (r.message && r.message.length) {
                            showSearchResults(r.message, txt);
                        } else {
                            clearSearchResults();
                        }
                    },
                });
            }, 300)
        );
    })();

    (()=> {
        document.addEventListener("DOMContentLoaded",function () {
            if(window.lucide){
                lucide.createIcons();
            }
        });
    })();
    

</script>>
