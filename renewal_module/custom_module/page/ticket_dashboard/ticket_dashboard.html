<!-- Ubold Style Navbar -->
<header class="app-topbar1">
    <div class="container1-fluid topbar-menu1">
        <div class="d-flex align-items-center gap-2">
            <!-- Topbar Brand Logo -->
            <div class="logo-topbar1">
                <!-- Logo light -->
                <a href="/app" class="logo-light1">
                    <span class="logo-lg1"><img src="/assets/renewal_module/images/logo.png" alt="logo1"></span>
                    <span class="logo-sm1"><img src="/assets/renewal_module/images/logo-sm-round.png"
                            alt="small logo1"></span>
                </a>
 
                <!-- Logo Dark -->
                <a href="/app" class="logo-dark1">
                    <span class="logo-lg1"><img src="/assets/renewal_module/images/logo.png" alt="logo1"></span>
                    <span class="logo-sm1"><img src="/assets/renewal_module/images/logo-sm-round.png"
                            alt="small logo1"></span>
                </a>
            </div>
 
            <!-- Sidebar Menu Toggle Button -->
            <button class="sidenav-toggle-button btn btn-default btn-icon">
                <i class="bi bi-list fs-22"></i>
            </button>
 
            <!-- Horizontal Menu Toggle Button -->
            <button class="topnav-toggle-button px-2" data-bs-toggle="collapse" data-bs-target="#topnav-menu-content">
                <i class="bi bi-list fs-22"></i>
            </button>
 
        </div> <!-- .d-flex-->
 
        <div class="d-flex align-items-center gap-1">
            <!-- Search -->
            <div class="app-search1 d-none d-xl-flex me-2">
                <input type="search" class="form-control1 topbar-search1 rounded-pill1" name="search"
                    placeholder="Quick Search...">
                <i data-lucide="search" class="app-search1-icon text-muted"></i>
            </div>
 
            <!-- Notification Dropdown -->
            <div class="topbar-item1">
                <div class="dropdown1">
                    <button class="topbar-link1 dropdown-toggle1 drop-arrow-none" data-bs-toggle="dropdown"
                        data-bs-offset="0,24" type="button" data-bs-auto-close="outside" aria-haspopup="false"
                        aria-expanded="false">
                        <i data-lucide="bell" class="fs-xxl"></i>
                        <span class="badge1 text-bg-danger badge1-circle topbar-badge"></span>
                    </button>
                    <div class="dropdown-menu1 p-0 dropdown-menu1-end dropdown-menu1-lg">
                        <!-- Header -->
                        <div class="px-3 py-2 border-bottom bg-light">
                            <div class="row align-items-center">
                                <div class="col">
                                    <h6 class="m-0 fs-md fw-semibold">Notifications</h6>
                                </div>
                                <div class="col text-end">
                                    <a href="#" id="total-notifications"
                                        class="badge1 badge1-soft-success badge1-label py-1">0 Notifications</a>
                                </div>
                            </div>
                        </div>
 
                        <!-- Scrollable Notifications List -->
                        <div id="notification-list" class="p-2" style="max-height: 300px; overflow-y: auto;">
                            <!-- JS will dynamically inject notifications here -->
                        </div>
 
                        <!-- Read All Button -->
                        <div class="border-top text-center py-2 bg-light sticky-bottom">
                            <a href="javascript:void(0);" id="see-more-btn"
                                class="text-reset text-decoration-underline fw-bold link-offset-2">
                                See More
                            </a>
                        </div>
                    </div><!-- End dropdown-menu1 -->
                </div> <!-- end dropdown-->
            </div> <!-- end topbar item-->
 
            <!-- Theme Mode Dropdown -->
            <div class="topbar-item1">
                <div class="dropdown1">
                    <button class="topbar-link1" data-bs-toggle="dropdown" data-bs-offset="0,24" type="button"
                        aria-haspopup="false" aria-expanded="false">
                        <i data-lucide="layout-grid" class="fs-xxl"></i>
                    </button>
 
                    <div class="dropdown-menu1 dropdown-menu1-lg p-2 dropdown-menu1-end">
                        <div class="row align-items-center g-1">
                            <div class="col-4">
                                <a href="/app/custom-calendar"
                                    class="dropdown-item1 border border-dashed rounded text-center py-2">
                                    <span class="avatar1-sm d-block mx-auto mb-1">
                                        <span class="avatar1-title bg-primary-subtle text-primary rounded-circle1">
                                            <i class="bi bi-calendar-event fs-18"></i>
                                        </span>
                                    </span>
                                    <span class="align-middle fw-medium">Calendar</span>
                                </a>
                            </div>
 
                            <div class="col-4">
                                <a href="javascript:void(0);"
                                    class="dropdown-item1 border border-dashed rounded text-center py-2">
                                    <span class="avatar1-sm d-block mx-auto mb-1">
                                        <span class="avatar1-title bg-primary-subtle text-primary rounded-circle1">
                                            <i class="bi bi-chat-dots fs-18"></i>
                                        </span>
                                    </span>
                                    <span class="align-middle fw-medium">Chat</span>
                                </a>
                            </div>
 
                            <div class="col-4">
                                <a href="javascript:void(0);"
                                    class="dropdown-item1 border border-dashed rounded text-center py-2">
                                    <span class="avatar1-sm d-block mx-auto mb-1">
                                        <span class="avatar1-title bg-primary-subtle text-primary rounded-circle1">
                                            <i class="bi bi-people fs-18"></i>
                                        </span>
                                    </span>
                                    <span class="align-middle fw-medium">Team</span>
                                </a>
                            </div>
 
                        </div>
                    </div>
 
                </div> <!-- end dropdown-->
            </div> <!-- end topbar item-->
 
            <!-- Theme Mode Dropdown -->
            <div class="topbar-item1">
                <div class="dropdown1">
                    <button class="topbar-link1" data-bs-toggle="dropdown" data-bs-offset="0,24" type="button"
                        aria-haspopup="false" aria-expanded="false">
                        <i data-lucide="sun" class="fs-xxl"></i>
                    </button>
                    <ul class="dropdown-menu1 dropdown-menu1-end thememode-dropdown">
 
                        <li>
                            <label class="dropdown-item1">
                                <i data-lucide="sun" class="align-middle me-1 fs-16"></i>
                                <span class="align-middle">Light</span>
                                <input class="form-check-input" type="radio" name="data-bs-theme" value="light">
                            </label>
                        </li>
 
                        <li>
                            <label class="dropdown-item1">
                                <i data-lucide="moon" class="align-middle me-1 fs-16"></i>
                                <span class="align-middle">Dark</span>
                                <input class="form-check-input" type="radio" name="data-bs-theme" value="dark">
                            </label>
                        </li>
 
                        <li>
                            <label class="dropdown-item1">
                                <i data-lucide="monitor-cog" class="align-middle me-1 fs-16"></i>
                                <span class="align-middle">System</span>
                                <input class="form-check-input" type="radio" name="data-bs-theme" value="system">
                            </label>
                        </li>
 
                    </ul> <!-- end dropdown-menu1-->
                </div> <!-- end dropdown-->
            </div> <!-- end topbar item-->
 
            <!-- FullScreen -->
            <div class="topbar-item1 d-none d-sm-flex">
                <button class="topbar-link1" type="button" data-toggle="fullscreen">
                    <i data-lucide="maximize" class="fs-xxl fullscreen-off"></i>
                    <i data-lucide="minimize" class="fs-xxl fullscreen-on"></i>
                </button>
            </div>
 
            <!-- Light/Dark Mode Button -->
            <div class="topbar-item1 d-none">
                <button class="topbar-link1" id="light-dark-mode" type="button">
                    <i data-lucide="moon" class="fs-xxl mode-light-moon"></i>
                </button>
            </div>
 
            <!-- Monocrome Mode Button -->
            <div class="topbar-item1 d-none d-sm-flex">
                <button class="topbar-link1" type="button" id="monochrome-mode">
                    <i data-lucide="palette" class="fs-xxl"></i>
                </button>
            </div>
 
            <!-- User Dropdown -->
            <div class="topbar-item1">
                <div class="dropdown1">
                    <a class="topbar-link1 dropdown-toggle1 drop-arrow-none" data-bs-toggle="dropdown"
                        data-bs-offset="0,19" href="javascript:void(0);" aria-haspopup="false" aria-expanded="false">
                        <span id="topbar-user-avatar1"
                            class="rounded-circle1 bg-primary1 text-white d-flex align-items-center justify-content-center"
                            style="width: 32px; height: 32px; font-weight: 600; font-size: 14px;">
                        </span>
                    </a>
                    <div class="dropdown-menu1 dropdown-menu1-end">
                        <!-- Header -->
                        <div class="dropdown-header1 noti-title d-none">
                            <h6 class="text-overflow m-0">Welcome back 👋!</h6>
                        </div>
 
                        <!-- My Profile -->
                        <a href="/app/user-profile" class="dropdown-item1">
                            <!--<i class="ti ti-user-circle me-1 fs-17 align-middle"></i>-->
                            <span class="align-middle">My Profile</span>
                        </a>
                        <!-- Settings -->
                        <a href="javascript:void(0);" class="dropdown-item1 my-settings-btn">
    <span class="align-middle">My Settings</span>
</a>

 
                        <!-- Reload -->
                        <a href="javascript:void(0);" class="dropdown-item1" onclick="location.reload()">
                            <!--<i class="ti ti-bell-ringing me-1 fs-17 align-middle"></i>-->
                            <span class="align-middle">Reload</span>
                        </a>
                        <!-- Apps -->
                        <a href="/apps" class="dropdown-item1">
                            <!--<i class="ti ti-headset me-1 fs-17 align-middle"></i>-->
                            <span class="align-middle">Apps</span>
                        </a>
                        <!-- view website -->
                        <a href="/" class="dropdown-item1" target="_blank">
                            <!--<i class="ti ti-bell-ringing me-1 fs-17 align-middle"></i>-->
                            <span class="align-middle">View Website</span>
                        </a>
 
                        <!-- Logout -->
                        <a href="javascript:void(0);" class="dropdown-item1 fw-semibold" onclick="frappe.app.logout()">
                            <!--<i class="ti ti-logout-2 me-1 fs-17 align-middle"></i>-->
                            <span class="align-middle">Log Out</span>
                        </a>
                    </div>
 
                </div>
            </div>
 
        </div>
    </div>
</header>

<!-- Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/lucide.min.css">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/lucide.min.js"></script>
